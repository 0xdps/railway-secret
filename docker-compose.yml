# Local development stack — mirrors the Railway deployment exactly.
#
# Prerequisites:
#   cp .env.example .env   # fill in RAILWAY_TOKEN, MASTER_KEY, etc.
#   docker compose up --build
#
# The app container runs start.sh which handles:
#   - mesahub-server (embedded, if MESAHUB_URL=mh://local/...)
#   - crond  (scheduled secret rotations)
#   - php-fpm + nginx  (web dashboard on http://localhost:8080)
#
# Tip: set DRY_RUN=true in your .env to let cron evaluate rotations without
# pushing any changes to Railway.

services:

  # ── Web application + cron ───────────────────────────────────────────────
  app:
    container_name: railway-secrets-app
    build: .
    ports:
      - "${PORT:-8099}:8080"
    env_file:
      - .env.local
    volumes:
      - data:/data
    restart: unless-stopped

# ── Persistent data volume (mesahub SQLite files) ────────────────────────────
# Preserved across container restarts.
# Inspect with: docker volume inspect railway-secrets_data
volumes:
  data:
